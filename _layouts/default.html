<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: 'Rickard Karlsson, scientist and engineer.' }}">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
<!-- For AI agents: a plain-text summary of this site is at /llms.txt -->
<div class="wrap">
  {% capture header %}
  <header>
    <a class="name" href="{{ '/' | relative_url }}">Rickard Karlsson</a>
    <nav>
      <a href="{{ '/research.html' | relative_url }}"{% if page.url == '/research.html' %} aria-current="page"{% endif %}>research</a>
    </nav>
  </header>
  {% endcapture %}
  {% if page.hero %}<div class="first">{{ header }}{% include hero.html %}</div>{% else %}{{ header }}{% endif %}
  <main>
{{ content }}
  </main>
  <footer>
    <a href="https://github.com/RickardKarl">github</a> ·
    <a href="https://linkedin.com/in/rickard-karlaxel-karlsson">linkedin</a> ·
    <a href="https://scholar.google.com/citations?user=sIln4MYAAAAJ&amp;hl=en">google scholar</a> ·
    <a href="https://x.com/RdKarlsson">twitter</a>
  </footer>
</div>
{% for s in page.scripts %}<script src="{{ s | relative_url }}"></script>
{% endfor %}</body>
</html>
